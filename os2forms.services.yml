services:
  Drupal\os2forms\Helper\HandlerConfigurationValidator:
    arguments:
      - "@form_builder"
      - "@messenger"

  Drupal\os2forms\EventSubscriber\HandlerConfigurationValidationSubscriber:
    arguments:
      - "@Drupal\\os2forms\\Helper\\HandlerConfigurationValidator"
      - "@current_route_match"
      - "@messenger"
    tags:
      - { name: event_subscriber }
